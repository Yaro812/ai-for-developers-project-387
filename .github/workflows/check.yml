name: check

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      # `mise install` has fetched Chromium; the runner also needs its system libraries.
      - run: mise run browser -- --with-deps
      - run: mise run check
      # Evidence for the human before a merge: the Playwright trace of the browser scenario,
      # the result and the commit it ran on. On `push` the checkout is the pushed commit, a pull request's head.
      - if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          mkdir -p e2e/test-results
          echo "sha=$(git rev-parse HEAD) result=$RESULT run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" | tee e2e/test-results/result.txt
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-${{ github.sha }}
          path: e2e/test-results/

  # The image is built and checked here only: it is not published, and `mise run check` does not use Docker.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag calendar .
      - run: docker run --detach --name calendar --publish 3000:3000 calendar
      # Without the OpenAPI file the server does not start; without the built frontend / answers 404.
      - run: curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 http://localhost:3000/api/health
      - run: curl --fail --silent --show-error http://localhost:3000/ | grep --quiet '<div id="root">'
      - if: failure()
        run: docker logs calendar
