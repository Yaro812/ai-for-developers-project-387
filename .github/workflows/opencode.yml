name: opencode
# The budget step below counts the runs of a pull request by this name.
run-name: "opencode #${{ github.event.issue.number || github.event.pull_request.number }}"

on:
  # The job's `if` lets in a trusted commenter only, and the first step refuses a fork's pull request.
  issue_comment: # jactionlint ignore=dangerous-triggers
    types: [created]
  pull_request_review_comment:
    types: [created]

# One run per issue or pull request; a second command waits for the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  opencode:
    # A command from a trusted human only: bots, the agent itself among them, and outside authors are skipped.
    if: >-
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      budget: ${{ steps.budget.outputs.state }}
      agent-started: ${{ steps.start.outputs.at }}
      agent-seconds: ${{ steps.finish.outputs.seconds }}
    permissions:
      # For the budget step: the history of this workflow's runs. The agent's tokens cannot rewrite it.
      actions: read
      # OpenCode's standard authorization: it exchanges the OIDC token for a token of the GitHub App,
      # and the App comments, pushes and opens pull requests.
      contents: read
      id-token: write
      # For `gh` in the agent's shell, which the App token does not reach:
      # the skills read and publish issues as docs/agents/issue-tracker.md describes.
      issues: write
      # For the fork check below.
      pull-requests: read
    steps:
      # A fork's code never runs next to the model key, whoever writes the command.
      - name: Refuse a pull request from a fork
        if: github.event.issue.pull_request || github.event.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: test "$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json isCrossRepository --jq .isCrossRepository)" = false

      # At most three admitted commands per pull request, checked before the model is called.
      # Every run whose job was not skipped spends an attempt: a general or a line comment, a cancelled
      # or timed-out run, and each Re-run (`run_attempt`). A new pull request starts a new budget.
      # ponytail: reads the whole run history of this workflow on every command; narrow it with `created=` when it grows.
      - name: Refuse a command over the pull request's budget
        id: budget
        if: github.event.issue.pull_request || github.event.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NAME: "opencode #${{ github.event.issue.number || github.event.pull_request.number }}"
          LIMIT: 3
        # With pipefail: a failed request must not read as zero attempts.
        shell: bash
        run: |
          used=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/opencode.yml/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.display_title == env.RUN_NAME and .conclusion != "skipped") | .run_attempt' |
            awk '{ sum += $1 } END { print sum + 0 }')
          echo "Attempts spent on this pull request, this one included: $used of $LIMIT"
          if [ "$used" -gt "$LIMIT" ]; then
            echo "state=exhausted" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same tools, npm dependencies and Git hooks as locally, so the agent can run `mise run check`.
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - run: mise run browser -- --with-deps

      # Locally these skills come from the mattpocock-skills plugin; a fresh runner has none.
      # They go to OpenCode's global directory, outside the working tree, so the agent cannot commit them.
      - name: Install the skills of the first project
        env:
          SKILLS_REF: 24fe0ef7737efae15c87225755e9f6f5965e4888 # mattpocock/skills v1.3.1
        run: |
          git clone --quiet https://github.com/mattpocock/skills "$RUNNER_TEMP/skills"
          git -C "$RUNNER_TEMP/skills" checkout --quiet "$SKILLS_REF"
          mkdir -p ~/.config/opencode/skills
          cp -R "$RUNNER_TEMP/skills/skills/engineering/." "$RUNNER_TEMP/skills/skills/productivity/." ~/.config/opencode/skills/

      # Everything above is preparation: a failure before this mark is reported as `infra`.
      - name: Check the model key and mark the agent's start
        id: start
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          test -n "$OPENCODE_API_KEY"
          echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: anomalyco/opencode/github@f4e363c8295fa90a03dddc451882fffe8fbce357 # v1.19.6
        # Shorter than the job's timeout, so the steps and the job after the agent still run.
        timeout-minutes: 25
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          # Nobody answers a permission request on a runner, so a rule that asks holds the agent until the timeout.
          # OpenCode asks by default about a path outside the repository, a repeated tool call and an .env file;
          # here the call is refused at once instead. The installed skills stay readable.
          OPENCODE_CONFIG_CONTENT: >-
            {
              "permission": {
                "doom_loop": "deny",
                "external_directory": { "*": "deny", "/home/runner/.config/opencode/skills/*": "allow" },
                "read": { "*.env": "deny", "*.env.*": "deny", "*.env.example": "allow" }
              }
            }
        with:
          model: opencode/big-pickle
          mentions: /opencode,/oc
          # Sessions are not published. This version of the action ignores the input; it records the decision.
          share: false

      - name: Measure the agent's run
        id: finish
        if: always() && steps.start.outputs.at
        env:
          STARTED: ${{ steps.start.outputs.at }}
        run: echo "seconds=$(( $(date +%s) - STARTED ))" >> "$GITHUB_OUTPUT"

  # The outcome of a stopped run is published without the model: the reason, the last SHA and the logs.
  report:
    needs: opencode
    if: always() && needs.opencode.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Publish why the agent stopped
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ github.event.issue.pull_request && true || github.event.pull_request && true || false }}
          BUDGET: ${{ needs.opencode.outputs.budget }}
          STARTED: ${{ needs.opencode.outputs.agent-started }}
          AGENT_SECONDS: ${{ needs.opencode.outputs.agent-seconds }}
        run: |
          # 1500 seconds is the agent step's timeout above. A reason that looks wrong is checked in the logs.
          if [ "$BUDGET" = exhausted ]; then
            reason=limit_exhausted
            detail="Бюджет запусков агента на этот pull request исчерпан; модель не вызывалась."
          elif [ -z "$STARTED" ]; then
            reason=infra
            detail="Подготовка раннера не дошла до агента: нет ключа модели или не установился инструмент."
          elif [ "${AGENT_SECONDS:-0}" -ge 1500 ]; then
            reason=timeout
            detail="Агент не уложился в отведённое время."
          else
            reason=agent_failed
            detail="Агент завершился с ошибкой."
          fi
          sha=$GITHUB_SHA
          if [ "$IS_PR" = true ]; then
            sha=$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          fi
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "**Нужен человек.** Агент остановлен, причина: \`$reason\`. $detail

          - Последний SHA: \`$sha\`
          - Журнал: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (попытка $GITHUB_RUN_ATTEMPT)

          Следующее действие выбирает человек: новая команда агенту этот отказ не отменяет."
